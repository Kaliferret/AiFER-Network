name: fernetwork
description: FER Network - Quantum-resistant (lattice crypto) messaging, blockchain wallet, frequency-hopping telemetry & offline-first AiFER OS protocol. Beautiful Base44 dark UI for resilient private networking. Co-created with human creativity & AI.
publish_to: none
version: 1.4.2+12

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Explicit direct dependency to force modern version and fix Gradle 'unknown property flutter' error
  app_links: ^7.0.0

  sizer: ^2.0.15
  flutter_svg: ^2.0.10
  google_fonts: ^6.2.0
  shared_preferences: ^2.3.0
  web: ^1.1.1
  cached_network_image: ^3.4.0
  connectivity_plus: ^6.0.3
  dio: ^5.7.0
  fluttertoast: ^8.2.5
  fl_chart: ^0.68.0
  image_picker: ^1.1.2
  permission_handler: ^11.3.1
  file_picker: ^8.1.2
  path_provider: ^2.1.4
  smooth_page_indicator: ^1.2.1
  emoji_picker_flutter: ^4.3.0
  supabase_flutter: ^2.12.4
  crypto: ^3.0.3
  sqflite: ^2.3.3
  path: ^1.9.0
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.1
  flutter_web_auth: ^0.6.0
  local_auth: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/

# Safety net
dependency_overrides:
  app_links: ^7.0.0
