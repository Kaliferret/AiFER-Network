name: Build FER Network APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
        
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'
          
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.5'
          cache: false   # DISABLED to force fresh resolution
          
      - name: Nuke pub cache for app_links (brute force fix)
        run: |
          rm -rf ${HOME}/.pub-cache/hosted/pub.dev/app_links-*
          rm -f pubspec.lock
          echo "Nuked old app_links cache and pubspec.lock"

      - name: Get dependencies (force major versions)
        run: |
          flutter pub get
          flutter pub upgrade --major-versions || true
          flutter pub get

      - name: Create local.properties
        run: |
          echo "flutter.sdk=${FLUTTER_ROOT}" > android/local.properties
          echo "sdk.dir=${ANDROID_HOME}" >> android/local.properties

      - name: Accept Android Licenses
        run: |
          yes | flutter doctor --android-licenses || true

      - name: Patch any remaining old app_links build.gradle (last resort)
        run: |
          find ${HOME}/.pub-cache -name "build.gradle" -path "*app_links*" 2>/dev/null | while read gradle_file; do
            echo "Patching $gradle_file..."
            sed -i 's/flutter\.compileSdkVersion/34/g' "$gradle_file" || true
            sed -i 's/flutter\.targetSdkVersion/34/g' "$gradle_file" || true
          done

      - name: Fix Android build configuration
        run: |
          chmod +x android/gradlew || true
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g" >> android/gradle.properties
          echo "org.gradle.daemon=false" >> android/gradle.properties

      - name: Analyze (non-blocking)
        run: flutter analyze --fatal-infos --fatal-warnings || echo "Analyze done with notes"
        continue-on-error: true

      - name: Clean previous builds
        run: flutter clean

      - name: Build APK (release) - Verbose
        run: |
          set -x
          flutter build apk --release --verbose 2>&1 | tee build-release.log

      - name: Find APK files
        run: |
          find . -name "*.apk" -type f -exec ls -lh {} \; || echo "No APKs found"
          ls -la build/app/outputs/flutter-apk/ 2>/dev/null || echo "Standard path not found"

      - name: Upload RELEASE APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: fer-network-release-apk
          path: |
            **/app-release.apk
            **/*.apk
          retention-days: 90
          if-no-files-found: warn

      - name: Upload build logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build-release.log
            **/*.log
          retention-days: 7
          if-no-files-found: ignore
