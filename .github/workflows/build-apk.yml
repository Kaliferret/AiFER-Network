name: Build FER Network APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # Allows manual trigger from GitHub Actions UI

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.5'
          cache: true
          
      - name: Verify Flutter installation
        run: |
          flutter --version
          echo "Flutter SDK location: $(which flutter)"
          flutter doctor -v
          
      - name: Get dependencies
        run: flutter pub get
        
      - name: Fix SDK constraint for Flutter 3.24.5
        run: |
          # Temporarily relax SDK constraint to allow Flutter 3.24.5 (Dart 3.5.4)
          sed -i 's/sdk: "^3.6.0"/sdk: ">=3.5.0 <4.0.0"/' pubspec.yaml
          
      - name: Get dependencies (after fix)
        run: flutter pub get
        
      - name: Analyze code for errors (non-blocking)
        run: flutter analyze || echo "Analysis completed with warnings"
        continue-on-error: true
        
      - name: Build APK (release) with verbose output
        run: |
          echo "=== Starting APK Build ==="
          echo "Current directory: $(pwd)"
          echo "Pubspec.yaml exists: $([ -f pubspec.yaml ] && echo 'YES')"
          
          # Try building APK
          flutter build apk --release --verbose 2>&1 | tee build.log
          BUILD_STATUS=$?
          echo "=== APK Build EXIT CODE: $BUILD_STATUS ==="
          
          if [ $BUILD_STATUS -ne 0 ]; then
            echo "::warning::Flutter build APK command failed with exit code $BUILD_STATUS"
            echo "::warning::Last 100 lines of build log:"
            tail -100 build.log
            
            # Try building for arm64-v8a only as fallback
            echo ""
            echo "=== Trying fallback build for arm64-v8a ==="
            flutter build apk --release --target-platform android-arm64 2>&1 | tee build-arm64.log
            BUILD_STATUS=$?
            echo "=== Fallback build EXIT CODE: $BUILD_STATUS ==="
          fi
          
          echo "=== APK Build Complete ==="
          
      - name: Show build log
        if: always()
        run: |
          echo "=== Last 50 lines of build log ==="
          tail -50 build.log || echo "No build log found"
          
      - name: List all build directories
        if: always()
        run: |
          echo "=== Root directory contents ==="
          ls -la
          echo ""
          echo "=== Build directory structure ==="
          find build -type f -name "*.apk" 2>/dev/null || echo "No APK files found in build/ directory"
          echo ""
          echo "=== All .apk files in workspace ==="
          find . -name "*.apk" -type f 2>/dev/null || echo "No APK files found anywhere"
          echo ""
          echo "=== Build directory tree ==="
          tree -L 5 build/ 2>/dev/null || find build -type d | head -20 || echo "Could not list build directory"
          
      - name: Verify APK exists and get details
        id: apk-check
        run: |
          echo "=== Searching for APK files ==="
          APK_FILES=$(find . -name "*.apk" -type f)
          APK_COUNT=$(echo "$APK_FILES" | wc -l)
          echo "Found $APK_COUNT APK file(s)"
          echo "$APK_FILES"
          
          if [ -z "$APK_FILES" ]; then
            echo "::error::No APK files were created during the build!"
            exit 1
          fi
          
          APK_PATH=$(echo "$APK_FILES" | head -1)
          echo "Using APK at: $APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          
          if [ ! -f "$APK_PATH" ]; then
            echo "::error::APK file path exists but file not found!"
            exit 1
          fi
          
          APK_SIZE=$(du -h "$APK_PATH" | cut -f1)
          echo "APK size: $APK_SIZE"
          echo "apk_size=$APK_SIZE" >> $GITHUB_OUTPUT
          
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fer-network-release-apk
          path: ${{ steps.apk-check.outputs.apk_path }}
          retention-days: 90
          if-no-files-found: error
          
      - name: Create Release Summary
        if: always()
        run: |
          echo "## 📱 FER Network APK Build" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Build Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### APK Details:" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.apk-check.outputs.apk_path }}" != "" ]; then
            echo "- **Path:** \`${{ steps.apk-check.outputs.apk_path }}\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Size:** ${{ steps.apk-check.outputs.apk_size }}" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Download Instructions:" >> $GITHUB_STEP_SUMMARY
            echo "1. Go to the **Actions** tab in this repository" >> $GITHUB_STEP_SUMMARY
            echo "2. Click on this workflow run" >> $GITHUB_STEP_SUMMARY
            echo "3. Scroll down to **Artifacts**" >> $GITHUB_STEP_SUMMARY
            echo "4. Download \`fer-network-release-apk\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Installation:" >> $GITHUB_STEP_SUMMARY
            echo "1. Download the APK" >> $GITHUB_STEP_SUMMARY
            echo "2. Enable **Install from Unknown Sources** in Android Settings" >> $GITHUB_STEP_SUMMARY
            echo "3. Tap the APK file to install" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ No APK file was created during the build" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Please check the build logs above for details." >> $GITHUB_STEP_SUMMARY
          fi