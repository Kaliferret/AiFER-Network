name: Build FER Network APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'lib/**'
      - 'android/**'
      - 'pubspec.yaml'
      - '.github/workflows/build-apk.yml'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Nuke all problematic caches + clean
        run: |
          rm -rf ~/.pub-cache/hosted/pub.dev/app_links-*
          rm -f pubspec.lock
          rm -rf ~/.gradle/caches
          flutter clean || true
          echo "✅ Nuked old caches, lockfile and Gradle cache"

      - name: Flutter pub get (force modern app_links)
        run: |
          flutter pub get --verbose

      - name: Create local.properties
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "sdk.dir=$ANDROID_HOME" >> android/local.properties

      - name: Accept Android Licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Generate debug keystore (if missing)
        run: |
          KEYSTORE_PATH="android/app/debug.keystore"
          if [ ! -f "$KEYSTORE_PATH" ]; then
            echo "Generating debug keystore..."
            keytool -genkey -v -keystore "$KEYSTORE_PATH" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" || true
          fi

      - name: Build Release APK + AppBundle (STRICT)
        run: |
          set -euo pipefail
          
          echo "=== [1/2] Building APK ==="
          flutter build apk --release --verbose 2>&1 | tee build-release.log || {
            echo "❌ APK build failed. Last 100 lines of log:"
            tail -100 build-release.log
            exit 1
          }
          
          echo ""
          echo "=== [2/2] Building AppBundle ==="
          flutter build appbundle --release --verbose 2>&1 | tee -a build-release.log || true
          
          echo ""
          echo "=== VERIFYING OUTPUT ==="
          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          
          if [ -f "$APK_PATH" ]; then
            echo "✅✅✅ SUCCESS: APK found at $APK_PATH"
            ls -lh "$APK_PATH"
          else
            echo "❌❌❌ FATAL: APK NOT FOUND!"
            echo "Searching for any .apk files..."
            find build -name "*.apk" -type f 2>/dev/null || true
            echo ""
            echo "Last 100 lines of build log:"
            tail -100 build-release.log
            exit 1
          fi

      - name: Upload Release APK + AAB
        uses: actions/upload-artifact@v4
        with:
          name: fer-network-release-apk
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
          if-no-files-found: error

      - name: Upload Build Log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs
          path: build-release.log
          retention-days: 7
