name: Build FER Network APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'lib/**'
      - 'android/**'
      - 'pubspec.yaml'
      - '.github/workflows/build-apk.yml'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: false

      - name: Nuke ALL problematic caches (aggressive)
        run: |
          rm -rf ~/.pub-cache
          rm -f pubspec.lock
          rm -rf ~/.gradle/caches
          rm -rf build
          flutter clean || true
          echo "✅ Nuked pub-cache, lockfile, Gradle cache and build dir"

      - name: Flutter pub get (force modern resolution)
        run: |
          flutter pub get --verbose

      - name: Create local.properties
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "sdk.dir=$ANDROID_HOME" >> android/local.properties

      - name: Accept Android Licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Build Release APK + AppBundle (STRICT + diagnostics)
        run: |
          set -euo pipefail
          
          echo "=== [1/2] Building APK ==="
          if flutter build apk --release --verbose 2>&1 | tee build-release.log; then
            echo "✅ APK build command completed"
          else
            echo "❌ APK build FAILED"
            echo "=== Last 120 lines of build log ==="
            tail -120 build-release.log
            exit 1
          fi
          
          echo ""
          echo "=== [2/2] Building AppBundle ==="
          flutter build appbundle --release --verbose 2>&1 | tee -a build-release.log || true
          
          echo ""
          echo "=== VERIFYING OUTPUT ==="
          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          
          if [ -f "$APK_PATH" ]; then
            echo "✅✅✅ SUCCESS: APK found at $APK_PATH"
            ls -lh "$APK_PATH"
          else
            echo "❌❌❌ FATAL: APK NOT FOUND at expected path!"
            echo "Searching for any .apk files..."
            find build -name "*.apk" -type f 2>/dev/null || true
            echo ""
            echo "=== Last 80 lines of build log ==="
            tail -80 build-release.log
            exit 1
          fi

      - name: Upload Release APK + AAB
        uses: actions/upload-artifact@v4
        with:
          name: fer-network-release-apk
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
          if-no-files-found: error

      - name: Upload Build Log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs
          path: build-release.log
          retention-days: 7
