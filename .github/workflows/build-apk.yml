name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      note:
        description: "Note for this run"
        required: false
        default: "manual verification"

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: read

env:
  FLUTTER_VERSION: '3.24.5'
  JAVA_VERSION: '17'
  NODE_VERSION: '24'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: false

      - name: Print versions
        run: |
          echo "Node: $(node -v)"
          echo "Java: $(java -version 2>&1 | head -1)"
          flutter --version

      - name: Nuke caches
        run: |
          rm -rf ~/.pub-cache || true
          rm -f pubspec.lock || true
          rm -rf ~/.gradle/caches || true

      - name: Flutter pub get
        run: flutter pub get

      - name: Build APK
        run: |
          flutter build apk --release 2>&1 | tee build-release.log

      - name: Verify APK
        run: |
          APK=$(find build/app/outputs/flutter-apk -name "*-release.apk" | head -n1)
          if [ ! -f "$APK" ]; then
            echo "::error::No APK found"
            exit 1
          fi
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aifer-release-apk
          path: build/app/outputs/flutter-apk/*-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build-release.log
          retention-days: 14
