name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: read

env:
  FLUTTER_VERSION: '3.24.5'
  JAVA_VERSION: '17'
  NODE_VERSION: '20'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Nuke caches
        run: |
          rm -rf ~/.pub-cache || true
          rm -f pubspec.lock || true
          rm -rf ~/.gradle/caches || true

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: false

      - name: Pub get
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Verify APK exists (fail hard)
        run: |
          APK=$(find build/app/outputs/flutter-apk -name "*-release.apk" | head -n1)
          if [ ! -f "$APK" ]; then
            echo "::error::No APK found"
            exit 1
          fi
          ls -lh "$APK"

      - uses: actions/upload-artifact@v4
        with:
          name: aifer-release-apk
          path: build/app/outputs/flutter-apk/*-release.apk
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aifer-build-logs
          path: build-release.log
          retention-days: 14

  verify-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: aifer-release-apk
          path: dist
      - run: |
          ls -la dist/
          APK=$(find dist -name "*.apk" | head -n1)
          test -s "$APK" || { echo "APK missing"; exit 1; }
          unzip -l "$APK" | grep -q "AndroidManifest.xml" || { echo "Invalid APK"; exit 1; }
          echo "✅ Artifact verified"

  release:
    needs: [build, verify-release]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: aifer-release-apk
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          fail_on_unmatched_files: true
          generate_release_notes: true
