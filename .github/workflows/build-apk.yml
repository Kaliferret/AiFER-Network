name: Build FER Network APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # Allows manual trigger from GitHub Actions UI

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.5'
          cache: true
          
      - name: Verify Flutter installation
        run: |
          flutter --version
          flutter doctor -v
          
      - name: Create local.properties
        run: |
          echo "flutter.sdk=${FLUTTER_ROOT}" > android/local.properties
          echo "sdk.dir=${ANDROID_HOME}" >> android/local.properties
          cat android/local.properties
          
      - name: Get dependencies
        run: flutter pub get
        
      - name: Fix SDK constraint for Flutter 3.24.5
        run: |
          sed -i 's/sdk: "^3.6.0"/sdk: ">=3.5.0 <4.0.0"/' pubspec.yaml
          flutter pub get
          
      - name: Accept Android Licenses
        run: |
          yes | flutter doctor --android-licenses || true
          
      - name: Analyze code for errors
        run: flutter analyze
        continue-on-error: true
        
      - name: Build APK (release)
        run: |
          echo "=== Building RELEASE APK ==="
          flutter build apk --release --verbose 2>&1 | tee build-release.log
          echo "=== Build Complete ==="
          
      - name: Find and List APK files
        run: |
          echo "=== Searching for APK files ==="
          find . -name "*.apk" -type f -exec ls -lh {} \; || echo "No APKs found"
          echo ""
          echo "=== Build directory contents ==="
          ls -la build/app/outputs/flutter-apk/ 2>/dev/null || echo "Standard output path not found"
          
      - name: Upload RELEASE APK
        uses: actions/upload-artifact@v4
        with:
          name: fer-network-release-apk
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            **/*.apk
          retention-days: 90
          if-no-files-found: error
          
      - name: Create Release Summary
        if: always()
        run: |
          echo "## 📱 FER Network APK Build" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Build Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Download Instructions:" >> $GITHUB_STEP_SUMMARY
          echo "1. Go to the **Actions** tab in this repository" >> $GITHUB_STEP_SUMMARY
          echo "2. Click on this workflow run" >> $GITHUB_STEP_SUMMARY
          echo "3. Scroll down to **Artifacts**" >> $GITHUB_STEP_SUMMARY
          echo "4. Download \`fer-network-release-apk\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Installation:" >> $GITHUB_STEP_SUMMARY
          echo "1. Download the APK" >> $GITHUB_STEP_SUMMARY
          echo "2. Enable **Install from Unknown Sources** in Android Settings" >> $GITHUB_STEP_SUMMARY
          echo "3. Tap the APK file to install" >> $GITHUB_STEP_SUMMARY
