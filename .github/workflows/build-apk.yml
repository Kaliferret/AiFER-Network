name: Build FER Network APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'lib/**'
      - 'android/**'
      - 'pubspec.yaml'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Nuke problematic app_links cache (brute force fix)
        run: |
          rm -rf ~/.pub-cache/hosted/pub.dev/app_links-*
          rm -f pubspec.lock
          echo "Nuked old app_links cache and lockfile"

      - name: Get dependencies
        run: |
          flutter pub get --verbose

      - name: Create local.properties
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "sdk.dir=$ANDROID_HOME" >> android/local.properties

      - name: Accept Android Licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Build Release APK + AppBundle
        id: build
        run: |
          set -x
          flutter build apk --release --verbose 2>&1 | tee build-release.log
          flutter build appbundle --release --verbose 2>&1 | tee -a build-release.log
          
          # Verify APK exists
          if [ -f build/app/outputs/flutter-apk/app-release.apk ]; then
            echo "✅ APK successfully built"
            ls -lh build/app/outputs/flutter-apk/app-release.apk
          else
            echo "❌ APK NOT FOUND!"
            find build -name "*.apk" 2>/dev/null || true
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fer-network-release-apk
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
          if-no-files-found: error

      - name: Upload Build Log (for debugging)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs
          path: build-release.log
          retention-days: 7
