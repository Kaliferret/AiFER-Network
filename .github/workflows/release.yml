name: Create Release with APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'
      create_tag:
        description: 'Create and push git tag'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    name: Build and Release APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
        
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.5'
          cache: true
          
      - name: Verify Flutter installation
        run: flutter --version
        
      - name: Get dependencies
        run: flutter pub get
        
      - name: Fix SDK constraint for Flutter 3.24.5
        run: |
          sed -i 's/sdk: "^3.6.0"/sdk: ">=3.5.0 <4.0.0"/' pubspec.yaml
          
      - name: Get dependencies (after fix)
        run: flutter pub get
        
      - name: Build APK (release)
        run: flutter build apk --release
        
      - name: Get APK info
        id: apk-info
        run: |
          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          APK_SIZE=$(du -h "$APK_PATH" | cut -f1)
          APK_SHA256=$(sha256sum "$APK_PATH" | cut -d' ' -f1)
          echo "size=$APK_SIZE" >> $GITHUB_OUTPUT
          echo "sha256=$APK_SHA256" >> $GITHUB_OUTPUT
          
      - name: Create tag (if requested)
        if: ${{ inputs.create_tag }}
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git tag -a ${{ inputs.version }} -m "Release ${{ inputs.version }}"
          git push origin ${{ inputs.version }}
          
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ inputs.version }}
          name: FER Network ${{ inputs.version }}
          body: |
            ## 📱 FER Network APK
            
            ### Download
            - **app-release.apk** (${{ steps.apk-info.outputs.size }})
              - Optimized release build
              - Supports: arm64-v8a, armeabi-v7a, x86_64
              - Min Android: 5.0 (API 21)
            
            ### Installation
            1. Download the APK below
            2. Enable "Install from Unknown Sources" in Android Settings
            3. Tap the APK file to install
            
            ### What's Included
            ✅ Lattice-crypto messaging
            ✅ Offline-first storage
            ✅ Frequency-hopping telemetry
            ✅ Blockchain wallet
            ✅ File manager with import/sharing
            ✅ Gaming hub with sessions
            ✅ Voice calls with network monitoring
            ✅ Base44 dark UI
            
            ### Verification
            **SHA256:** \`${{ steps.apk-info.outputs.sha256 }}\`
            
            ### Support
            Open an issue if you encounter any bugs or problems.
          files: |
            build/app/outputs/flutter-apk/app-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Create Release Summary
        if: always()
        run: |
          echo "## 🎉 Release Created Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ inputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### APK Details" >> $GITHUB_STEP_SUMMARY
          echo "- **Size:** ${{ steps.apk-info.outputs.size }}" >> $GITHUB_STEP_SUMMARY
          echo "- **SHA256:** \`${{ steps.apk-info.outputs.sha256 }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Access Release" >> $GITHUB_STEP_SUMMARY
          echo "1. Go to the **Releases** tab in this repository" >> $GITHUB_STEP_SUMMARY
          echo "2. Find release **${{ inputs.version }}**" >> $GITHUB_STEP_SUMMARY
          echo "3. Download \`app-release.apk\` from the Assets section" >> $GITHUB_STEP_SUMMARY