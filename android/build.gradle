allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
    
    // Apply flutter extension properties for plugins that expect it
    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            // Fix compileSdk for plugins that don't specify it
            try {
                if (project.android.compileSdkVersion == null) {
                    project.android.compileSdkVersion 35
                }
            } catch (Exception ignored) {
                // Property may not be readable, set it anyway
                try {
                    project.android.compileSdkVersion 35
                } catch (Exception ignored2) {}
            }
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
