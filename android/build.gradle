allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}

// Provide flutter extension properties for plugins that expect them
subprojects { subproject ->
    afterEvaluate { 
        // Add default SDK versions for plugins that reference flutter.compileSdkVersion
        if (subproject.hasProperty('android')) {
            def androidExt = subproject.extensions.findByName('android')
            if (androidExt != null) {
                try {
                    if (androidExt.compileSdkVersion == null) {
                        androidExt.compileSdkVersion = 35
                    }
                } catch (Exception ignored) {}
            }
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
